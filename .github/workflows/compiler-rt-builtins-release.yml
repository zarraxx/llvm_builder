name: Build and release compiler-rt builtins

run-name: Build compiler-rt builtins with LLVM ${{ inputs.llvm_version }}

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: LLVM version
        required: true
        default: 22.1.8
        type: choice
        options:
          - 22.1.8

permissions:
  contents: write

concurrency:
  group: compiler_rt_builtins-llvm-${{ inputs.llvm_version }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LLVM_VERSION: ${{ inputs.llvm_version }}
      GCC_VERSION: 15.2.0

    steps:
      - name: Check out dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore source archive cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: >-
            llvm-builder-${{ runner.os }}-compiler-rt-${{ inputs.llvm_version }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            cmake \
            ninja-build \
            xz-utils

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Build and package compiler-rt builtins
        run: |
          uv run --frozen python3 src/BuilderRunner.py \
            packages/compiler_rt_builtins.py \
            -DLLVM_VERSION="${LLVM_VERSION}"

      - name: Check release archive
        run: |
          archive="dist/compiler_rt_builtins-llvm${LLVM_VERSION}.tar.xz"
          archive_root="compiler_rt_builtins-llvm${LLVM_VERSION}/"
          manifest="${archive}.contents"
          llvm_major="${LLVM_VERSION%%.*}"
          test -s "${archive}"
          xz --test "${archive}"
          tar -tf "${archive}" > "${manifest}"
          test "$(sed -n '1p' "${manifest}")" = "${archive_root}"
          grep -Fqx \
            "${archive_root}lib/clang/${llvm_major}/lib/riscv64-unknown-linux-gnu/libclang_rt.builtins.a" \
            "${manifest}"
          sha256sum "${archive}" | tee "${archive}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiler_rt_builtins-llvm${{ inputs.llvm_version }}
          path: |
            dist/compiler_rt_builtins-llvm${{ inputs.llvm_version }}.tar.xz
            dist/compiler_rt_builtins-llvm${{ inputs.llvm_version }}.tar.xz.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="compiler_rt_builtins-llvm${LLVM_VERSION}"
          archive="dist/compiler_rt_builtins-llvm${LLVM_VERSION}.tar.xz"
          checksum="${archive}.sha256"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${archive}" "${checksum}" --clobber
            git tag --force "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}" --force
          else
            gh release create "${tag}" "${archive}" "${checksum}" \
              --target "${GITHUB_SHA}" \
              --title "${tag}" \
              --generate-notes
          fi
